# ═══════════════════════════════════════════════════════════════
# Omarchy Fresh Build — configuration
# Flat key=value pairs; first match wins; empty value → built-in default.
# ${HOME} is expanded in values. Lines starting with # are comments.
# Section headers ([name]) are ignored by the parser, for readability only.
#
# Decision keys (DEVICE_TYPE / INSTALL_PULSE / INSTALL_FONTS / TAILSCALE_INSTALL)
# left empty → you'll be asked once at the start of the build; pin them here to
# make runs fully unattended. Env vars always win over this file.
# ═══════════════════════════════════════════════════════════════

[device]
# desktop → sunshine, corectrl, gaming stack; no tailscale/syncthing
# laptop  → tailscale, syncthing; no sunshine/corectrl/gaming
DEVICE_TYPE=

[components]
# Empty → asked at start of build (defaults: pulse yes, fonts no).
INSTALL_PULSE=
INSTALL_FONTS=
# Optional override of the device-profile default (laptop→yes, desktop→no):
TAILSCALE_INSTALL=

[network]
NAS_IP=nas.local
LAN_SUBNET=192.168.200.0/24
TAILSCALE_NET=100.64.0.0/10

[smb-fonts]
SMB_SERVER=nas.local
SMB_SHARE_PATH=pool/installer/Apps/linux/windowsFonts
# Leave empty to be offered at the upfront prompt:
SMB_USER=
SMB_PASS=

[nas-mounts]
# CIFS server for fstab mounts: Tailscale IP preferred if set, else NAS_IP.
NAS_TAILSCALE_IP=

[paths]
BUILD_DIR=${HOME}/.config/omarchy/plugins
PULSE_DIR=${HOME}/pulse-omarchy
