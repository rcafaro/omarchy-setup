# ═══════════════════════════════════════════════════════════════
# Omarchy Fresh Build — configuration
# Flat key=value pairs; first match wins; empty value → built-in default.
# ${HOME} is expanded in values. Lines starting with # are comments.
# Section headers ([name]) are ignored by the parser, for readability only.
# ═══════════════════════════════════════════════════════════════

[network]
NAS_IP=nas.local
LAN_SUBNET=192.168.200.0/24
TAILSCALE_NET=100.64.0.0/10

[smb-fonts]
SMB_SERVER=nas.local
SMB_SHARE_PATH=pool/installer/Apps/linux/windowsFonts
# Leave empty to be prompted at runtime (section 12):
SMB_USER=
SMB_PASS=

[nas-mounts]
# CIFS server for fstab mounts: Tailscale IP preferred if set, else NAS_IP.
NAS_TAILSCALE_IP=

[paths]
BUILD_DIR=${HOME}/.config/omarchy/plugins
PULSE_DIR=${HOME}/pulse-omarchy
